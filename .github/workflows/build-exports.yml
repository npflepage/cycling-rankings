name: Build BT exports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'model/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # or whatever you need
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run model and generate JSON exports
        run: |
          uv run python model/export_for_web.py \
            --relabel-iters 4 \
            --data-dir ./data \
            --out-dir ./docs/outputs \
            --min-races 2

      - name: Upload exports to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync docs/outputs/ s3://${{ secrets.R2_BUCKET_NAME }}/ \
            --content-type application/json \
            --cache-control "public, max-age=3600" \
            --no-progress
