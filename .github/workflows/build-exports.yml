name: Build BT exports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'model/**'
      - '.github/workflows/build-exports.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openskill numpy

      - name: Run model and generate JSON exports
        run: |
          python model/export_for_web.py \
            --data-dir ./data \
            --out-dir ./docs/outputs \
            --min-races 2

      - name: Commit and push if outputs changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: rebuild BT exports [skip ci]"
            git push
          fi
