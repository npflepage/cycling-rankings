name: Build BT exports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'model/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update releases

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run model and generate JSON exports
        run: |
          uv run python model/export_for_web.py \
            --relabel-iters 4 \
            --data-dir ./data \
            --out-dir ./docs/outputs \
            --min-races 2

      - name: Delete existing 'latest-data' release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the release itself (ignore error if it doesn't exist yet)
          gh release delete latest-data --yes 2>/dev/null || true
          # Delete the tag too (the release recreates it)
          git push origin :refs/tags/latest-data 2>/dev/null || true

      - name: Upload outputs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-data \
            --title "Latest data exports" \
            --notes "Auto-generated on $(date -u '+%Y-%m-%d %H:%M UTC') from commit ${{ github.sha }}" \
            docs/outputs/hall_of_fame.json \
            docs/outputs/meta.json \
            docs/outputs/rider_timeseries.json \
            docs/outputs/top_history.json